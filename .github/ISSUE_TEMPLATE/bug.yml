name: Bug report
description: Something behaves differently from what it says it does.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Not for security problems.** Those go through [SECURITY.md](https://github.com/no42-org/twiki/blob/main/SECURITY.md), privately.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or release. `docker buildx imagetools inspect <ref>` gives the digest if you pin one.
      placeholder: "0.0.7, or :latest at <digest>"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - shadow
        - enforce
        - not running the agent (dashboard only)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Redact tokens and keys — this is a public issue.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I checked this is not already reported.
        - label: I have removed credentials from anything I pasted.
          required: true
