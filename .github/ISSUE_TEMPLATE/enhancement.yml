name: Enhancement
description: Something twiki should do, or should do differently.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or impossible today. Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. A problem well described is more useful than a solution proposed.
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds you are living with, and why they are not enough.
