name: Publish rc

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Only the newest main commit needs to be :rc — cancel the ones it overtook.
  # The opposite of release.yml, where cancelling would publish half a release.
  group: publish-rc
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  publish-rc:
    name: Build, publish & sign :rc
    # :rc always reflects main — also guards manual dispatches from other refs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push the :rc image to GHCR
      id-token: write # cosign keyless (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache on a publishing workflow. A pull request can
      # populate the npm cache, and this job would then build the signed,
      # released artifact out of whatever was cached (zizmor: cache-poisoning).
      # CI still caches - it publishes nothing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # The real off switch. `cache: ""` does NOT disable caching: an empty
          # `cache` falls through to setup-node's automatic package-manager
          # cache, which defaults to true and activates as soon as package.json
          # gains a top-level `packageManager` or `devEngines.packageManager`
          # naming npm. Neither exists today, so nothing caches - but a future
          # corepack change would silently start restoring a pull-request-
          # populated cache into the job that signs and publishes.
          package-manager-cache: false
      - run: npm ci

      # ---- The quality gate, on the path that ships ----
      # Pull requests were gated and releases were not: this workflow built,
      # signed and published without lint, typecheck or the test suite ever
      # running (#78). `make verify` is the single definition of the gate -
      # the Makefile is the reusable unit here, and CI invokes the same target
      # - so this consults it rather than restating it.
      - run: make verify

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Scan the image content before publishing (report-only, same rationale as
      # CI: distroless base CVEs aren't patchable here — see ci.yml).
      # Ordered after buildx setup to match release.yml step for step.
      - run: make image
      - name: Trivy scan published image content (report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: twiki:dev
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercased for the same reason release.yml lowercases it: a registry
      # reference must be lowercase, and an owner or repo name carrying a
      # capital would fail the push here while the release path still worked.
      - name: Resolve image reference
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # One mutable :rc tag. The overwrite IS the space control: a tag per
      # commit left 53 permanent multi-arch manifests behind, and nothing
      # consumed them. Anyone needing an immutable reference pins the digest
      # this tag resolves to.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:rc
          provenance: true
          sbom: true

      # Signed on the same terms as a release: the index digest, not a child.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # No GitHub pre-release accompanies :rc. main produces an image and
      # nothing else, so there is no moving release entry to keep in step.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: twiki.sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-rc
          path: twiki.sbom.spdx.json
          if-no-files-found: error
