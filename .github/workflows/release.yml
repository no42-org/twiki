name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  # Serialize per tag. Never cancel: a half-published release leaves some tags
  # pushed and others not. `main` builds are in publish-rc.yml, where cancelling
  # IS correct.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build, publish & sign
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release
      packages: write # push to GHCR
      id-token: write # cosign keyless (OIDC)
      attestations: write # SLSA build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache on a publishing workflow. A pull request can
      # populate the npm cache, and this job would then build the signed,
      # released artifact out of whatever was cached (zizmor: cache-poisoning).
      # CI still caches - it publishes nothing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # The real off switch. `cache: ""` does NOT disable caching: an empty
          # `cache` falls through to setup-node's automatic package-manager
          # cache, which defaults to true and activates as soon as package.json
          # gains a top-level `packageManager` or `devEngines.packageManager`
          # naming npm. Neither exists today, so nothing caches - but a future
          # corepack change would silently start restoring a pull-request-
          # populated cache into the job that signs and publishes.
          package-manager-cache: false
      - run: npm ci

      # ---- The quality gate, on the path that ships ----
      # Pull requests were gated and releases were not: this workflow built,
      # signed and published without lint, typecheck or the test suite ever
      # running (#78). `make verify` is the single definition of the gate -
      # the Makefile is the reusable unit here, and CI invokes the same target
      # - so this consults it rather than restating it.
      - run: make verify


      # ---- The tag must name the version the artifacts will carry ----
      # package.json is the version of record (design D5). Without this check a
      # tag and a manifest can disagree silently, and the image and tarball then
      # self-report a version nobody can find.
      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Error: tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            echo "The image and the tarball would self-report a version nobody can find."
            echo "Bump package.json and commit it before tagging."
            exit 1
          fi
          # Narrower than semver on purpose. npm accepts build metadata
          # (1.2.3+meta), `+` is not a legal Docker tag character, and the tag
          # derivation below would happily build an image nobody can push -
          # failing after the tarball is already built. Refuse it up front.
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: version ${version} is not X.Y.Z or X.Y.Z-prerelease."
            echo "Build metadata (+meta) is valid semver but cannot be a Docker tag."
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      # ---- Resolve image tags (design D1/D2/D3) ----
      # A prerelease (v1.2.0-rc.1) gets its exact version and nothing else, so
      # :latest and the floating :X.Y keep pointing at the newest STABLE
      # release. No floating major tag is published: it spans every release ever
      # cut, distinguishes nothing, and was the tag that regressed in #66.
      - name: Resolve image tags
        run: |
          set -euo pipefail
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "IMAGE_TAGS=${image}:${VERSION}" >> "$GITHUB_ENV"
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAGS=${image}:${VERSION},${image}:${VERSION%.*},${image}:latest" >> "$GITHUB_ENV"
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      # ---- Build the npm tarball (includes dist/ via package "files") ----
      # No VERSION= argument: package.json already carries it, and the check
      # above proved it matches the tag.
      - id: pack
        name: Build and pack tarball
        run: |
          set -euo pipefail
          tarball="$(make pack | tail -n1)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          test -s "${tarball}"

      # ---- Build & push the multi-arch image (design release-D4: no QEMU compile) ----
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Scan the image content before publishing (report-only, same rationale as
      # CI: distroless base CVEs aren't patchable here — see ci.yml). This makes
      # the release self-contained rather than relying on a prior CI run.
      - run: make image
      - name: Trivy scan published image content (report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: twiki:dev
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          provenance: true
          sbom: true

      # ---- Sign the pushed digest (cosign keyless / OIDC) ----
      # This is the image INDEX digest that buildx pushed, which is what must be
      # verified. Verifying a per-architecture child instead fails with "no
      # signatures found", which reads like a missing signature rather than the
      # wrong question. RELEASING.md carries the matching verify command.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"

      # ---- Generate an SBOM for the published image ----
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: twiki.sbom.spdx.json

      # ---- Checksums over everything the release ships ----
      # One file to sign and one file for a consumer to verify downloads
      # against. Without it each artifact needs its own signature, and nothing
      # ties the set together.
      - id: sums
        name: Checksum the release artifacts
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          sha256sum "${TARBALL}" twiki.sbom.spdx.json > checksums.txt
          cat checksums.txt

      # ---- Sign the checksums (cosign keyless / OIDC) ----
      # The image was already signed above; this covers the FILES, which
      # shipped unsigned through v0.0.8 (#97). Signature and certificate are
      # attached beside the checksums so verification needs nothing but the
      # release page.
      - name: Sign checksums
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      # ---- SLSA build provenance ----
      # `provenance: true` on build-push-action produces BUILDKIT provenance
      # attached in the registry, which is NOT what `gh attestation verify`
      # resolves - that reads GitHub's attestation API, which had nothing for
      # v0.0.8 and returned a 404 that looked like a lookup failure (#97).
      # These two steps are what put it there.
      - name: Attest the image build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest the release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.pack.outputs.tarball }}
            twiki.sbom.spdx.json

      # ---- Publish the GitHub Release ----
      # `make_latest` follows the tag: a prerelease never becomes latest, and
      # a stable tag always does. There is no highest-version guard — pushing a
      # stable tag lower than an existing one WILL move :latest backward. See
      # design D3 for why that trade is acceptable while no older release line
      # is maintained, and what must be restored when one is.
      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE != 'true' }}
          files: |
            ${{ steps.pack.outputs.tarball }}
            twiki.sbom.spdx.json
            checksums.txt
            checksums.txt.sig
            checksums.txt.pem
