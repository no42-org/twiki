name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege by default; jobs elevate only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck & test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: make verify # lint + typecheck + test

  image-scan:
    name: Build image & Trivy scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF to the security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Build only (make image uses --load); never pushed on pull requests.
      - run: make image
      - name: Trivy scan (report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: twiki:dev
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          # Report-only by design: the runtime is distroless (no package
          # manager), so base-image OS CVEs (e.g. openssl) can't be patched
          # here — only by a newer upstream base. Findings surface in the
          # Security tab via the SARIF upload below; blocking would leave CI
          # red on upstream issues we cannot fix on demand.
          exit-code: "0"
      - name: Upload Trivy SARIF
        if: always() # upload even if a future scan is made blocking
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-results.sarif

  audit:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Report advisories; do not block merges on findings without a fix.
      - run: make audit
        continue-on-error: true

  # ---- Workflows lint their own workflows ----
  # Pinning, least privilege, timeouts, injection safety and the rest were
  # enforced by whoever remembered to check. actionlint covers syntax and shell
  # correctness; zizmor covers the security rules. Both fail the build, so a
  # regression is caught on the pull request that introduces it.
  actions:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # zizmor uploads SARIF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Downloaded by checksum rather than `uses: rhysd/actionlint@<sha>`.
      # That repo ships no action.yml, so the runner falls back to its
      # Dockerfile and rebuilds from golang:latest and alpine:latest on every
      # run - three mutable tags, in a container the runner mounts the docker
      # socket into, in a job holding security-events: write. Pinning the SHA
      # of a repo whose base images float buys very little.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # Pin the TOOL as well as the action. The action's `version` input
          # defaults to `latest`, so an unpinned zizmor would download a new
          # release on every run - turning CI red on an unchanged repository
          # when an audit is added, or silently dropping one when it is not.
          # Dependabot cannot see this pin; bump it deliberately.
          version: "1.29.0"
          # Findings BELOW this severity are filtered out entirely - not
          # logged, not in the SARIF. So `low` means informational findings
          # disappear rather than being reported-but-tolerated. Chosen anyway:
          # the one open informational finding suggests replacing
          # action-gh-release with `gh release` in a script, which would mean
          # re-validating the whole publish path.
          min-severity: low
